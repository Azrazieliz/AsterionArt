name: Asterion Art authenticated release APK
on:
  workflow_dispatch:
    inputs:
      bundle_reasoning_and_vision:
        description: "Embed pinned offline Qwen3 and Qwen3-VL weights (multi-GB release)"
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: asterion-art-owner-release
  cancel-in-progress: false
jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: asterion-release
    if: github.ref == 'refs/heads/research/model-capabilities-no-build-20261027'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fail closed unless the ORIGINAL owner release identity is present
        shell: bash
        env:
          ASTERION_RELEASE_KEYSTORE_B64: ${{ secrets.ASTERION_RELEASE_KEYSTORE_B64 }}
          ASTERION_RELEASE_PASSWORD: ${{ secrets.ASTERION_RELEASE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ASTERION_RELEASE_KEYSTORE_B64" || {
            echo "::error::Original owner keystore is not configured as a protected Actions secret; no signed APK can be produced."
            exit 1
          }
          test -n "$ASTERION_RELEASE_PASSWORD" || {
            echo "::error::Original owner release passphrase is not configured; refusing to create or substitute a new key."
            exit 1
          }
          umask 077
          KEYFILE="$RUNNER_TEMP/asterion-art-release.p12"
          printf '%s' "$ASTERION_RELEASE_KEYSTORE_B64" | base64 --decode > "$KEYFILE"
          python3 native/verify_release_signing.py keystore "$KEYFILE"
          printf 'ASTERION_RELEASE_KEYSTORE=%s\\n' "$KEYFILE" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source tests, native extraction and model planning
        run: |
          python -m pip install --disable-pip-version-check numpy
          python -m unittest discover -s fusion -p 'test_*.py' -v
          python -m unittest discover -s native -p 'test_*.py' -v
      - name: Install pinned Android NDK and CMake
        run: |
          yes | sdkmanager "ndk;27.2.12479018" "cmake;3.31.6" > /dev/null
      - name: Fetch exact audited local llama.cpp runtime
        run: |
          git clone --quiet --depth 1 --branch v0.7.0 https://github.com/ggml-org/llama.cpp.git native/llama.cpp
          test "$(git -C native/llama.cpp rev-parse HEAD)" = "620d2225cc436ab0b001e3200e590e3b286ef9ab"
      - name: Install checksum-verified embedded native image engines
        run: |
          python3 native/prepare_native_runtime.py --project .
          python3 native/prepare_realsr.py --project .
      - name: Bundle pinned Qwen3 reasoning and Qwen3-VL models only when requested
        if: ${{ inputs.bundle_reasoning_and_vision }}
        run: |
          python3 native/prepare_inference_weights.py --project .
          test -s app/src/main/assets/inference/Qwen_Qwen3-0.6B-Q5_K_M.gguf
          test -s app/src/main/assets/inference/Qwen3VL-2B-Instruct-Q4_K_M.gguf
          test -s app/src/main/assets/inference/mmproj-Qwen3VL-2B-Instruct-Q8_0.gguf
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Test Android app and original creation contracts
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace
      - name: Build only the APK signed with the ORIGINAL owner key
        env:
          ASTERION_RELEASE_PASSWORD: ${{ secrets.ASTERION_RELEASE_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleRelease --stacktrace
          test -s app/build/outputs/apk/release/app-release.apk
          python3 native/verify_apk_native.py --apk app/build/outputs/apk/release/app-release.apk
          python3 native/verify_release_signing.py apk app/build/outputs/apk/release/app-release.apk \
            "$ASTERION_RELEASE_KEYSTORE" "$ANDROID_HOME/build-tools/35.0.0/apksigner"
      - name: Upload VERIFIED owner-signed release candidate
        uses: actions/upload-artifact@v4
        with:
          name: Asterion-Art-ORIGINAL-KEY-SIGNED-RELEASE-CANDIDATE
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary key material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/asterion-art-release.p12"
