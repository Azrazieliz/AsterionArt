name: Art reconstruction

on:
  push:
    branches: [work/art-clean-reconstruction-20261128]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build isolated reconstruction APK and verify workflow invariants
        run: bash ./gradlew :creation:test :app:testDebugUnitTest :app:assembleDebug

  studio-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the isolated emulator APK
        run: bash ./gradlew :app:assembleDebug -PasterionStudioEmulator=true
      - name: Launch Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sdkmanager --install 'system-images;android-35;google_apis;x86_64'
          echo no | avdmanager create avd -n asterion-qa -k 'system-images;android-35;google_apis;x86_64'
          mkdir -p build/studio-qa
          nohup "$ANDROID_HOME/emulator/emulator" -avd asterion-qa -port 5554 -memory 3072 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > build/studio-qa/emulator.log 2>&1 &
          timeout 180 adb -s emulator-5554 wait-for-device
          timeout 180 bash -c 'until [[ $(adb -s emulator-5554 shell getprop sys.boot_completed | tr -d "\r") = 1 ]]; do sleep 2; done'
          adb -s emulator-5554 shell input keyevent KEYCODE_WAKEUP
          adb -s emulator-5554 shell wm dismiss-keyguard
          adb -s emulator-5554 shell settings put global window_animation_scale 0
          adb -s emulator-5554 shell settings put global transition_animation_scale 0
          adb -s emulator-5554 shell settings put global animator_duration_scale 0
          adb -s emulator-5554 install app/build/outputs/apk/debug/app-debug.apk
      - name: Exercise reference picker, scene sharing and queue recovery
        run: python3 app/qa/studio_smoke.py
      - name: Upload Studio check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-emulator-evidence
          path: build/studio-qa/
