name: Android build and unit tests
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify bounded-memory model fusion
        run: |
          python -m pip install --disable-pip-version-check numpy
          python -m unittest discover -s fusion -p 'test_*.py' -v
      - name: Validate native extraction
        run: python -m unittest discover -s native -p 'test_*.py' -v
      - name: Embed pinned Local Dream native engine
        run: python3 native/prepare_native_runtime.py --project .
      - name: Embed MIT RealSR / Real-ESRGAN native enhancement runtime
        run: python3 native/prepare_realsr.py --project .
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Verify packaged engine and Qualcomm runtime checksums
        run: python3 native/verify_apk_native.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Asterion-Art-Android-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/test-results/testDebugUnitTest/**/*.xml
            app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn
