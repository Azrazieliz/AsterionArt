# Development-stage source checks only. No APK, AAB, Android Gradle, or
# native compilation tasks until the owner authorizes application builds.
name: Asterion Art source checks (no APK build)
on:
  workflow_dispatch:
jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check model fusion unit logic (no Android build)
        run: |
          python -m pip install --disable-pip-version-check numpy
          python -m unittest discover -s fusion -p 'test_*.py' -v
      - name: Check native archive preparation logic (no Android build)
        run: python -m unittest discover -s native -p 'test_*.py' -v
