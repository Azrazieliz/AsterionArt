name: Asterion Art Android integration and APK
on:
  push:
    branches: ['research/model-capabilities-no-build-20261027']
  workflow_dispatch:
concurrency:
  group: asterion-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify bounded-memory model fusion
        run: |
          python -m pip install --disable-pip-version-check numpy
          python -m unittest discover -s fusion -p 'test_*.py' -v
      - name: Validate native extraction
        run: python -m unittest discover -s native -p 'test_*.py' -v
      - name: Install Android NDK and native CMake
        run: |
          yes | sdkmanager "ndk;27.2.12479018" "cmake;3.31.6" >/dev/null
      - name: Fetch pinned MIT-licensed long-context inference engine
        run: |
          git clone --quiet --depth 1 --branch v0.7.0 https://github.com/ggml-org/llama.cpp.git native/llama.cpp
          test "$(git -C native/llama.cpp rev-parse HEAD)" = "620d2225cc436ab0b001e3200e590e3b286ef9ab"
      - name: Embed pinned Local Dream native engine
        run: python3 native/prepare_native_runtime.py --project .
      - name: Embed MIT RealSR / Real-ESRGAN native enhancement runtime
        run: python3 native/prepare_realsr.py --project .
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Verify embedded native long-context LLM
        run: unzip -l app/build/outputs/apk/debug/*.apk | grep "libai-chat.so"
      - name: Verify packaged engine and Qualcomm runtime checksums
        run: python3 native/verify_apk_native.py
      - name: Download and verify APK-bundled offline reasoning and vision weights
        if: github.event_name == 'workflow_dispatch'
        run: |
          python3 native/prepare_inference_weights.py --project .
          test -s app/src/main/assets/inference/Qwen_Qwen3-0.6B-Q5_K_M.gguf
          test -s app/src/main/assets/inference/Qwen3VL-2B-Instruct-Q4_K_M.gguf
          test -s app/src/main/assets/inference/mmproj-Qwen3VL-2B-Instruct-Q8_0.gguf
      - name: Build and verify release; sign ONLY with existing owner identity
        id: release
        shell: bash
        env:
          ASTERION_RELEASE_KEYSTORE_B64: ${{ secrets.ASTERION_RELEASE_KEYSTORE_B64 }}
          ASTERION_RELEASE_PASSWORD: ${{ secrets.ASTERION_RELEASE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYFILE="$RUNNER_TEMP/asterion-art-release.p12"
          trap 'rm -f "$KEYFILE"' EXIT
          if [ -n "$ASTERION_RELEASE_KEYSTORE_B64" ] || [ -n "$ASTERION_RELEASE_PASSWORD" ]; then
            test -n "$ASTERION_RELEASE_KEYSTORE_B64" && test -n "$ASTERION_RELEASE_PASSWORD" || {
              echo "::error::Incomplete original signing identity; release blocked"
              exit 1
            }
            umask 077
            printf '%s' "$ASTERION_RELEASE_KEYSTORE_B64" | base64 --decode > "$KEYFILE"
            python3 native/verify_release_signing.py keystore "$KEYFILE"
            export ASTERION_RELEASE_KEYSTORE="$KEYFILE"
            gradle --no-daemon :app:assembleRelease --stacktrace
            test -s app/build/outputs/apk/release/app-release.apk
            python3 native/verify_apk_native.py --apk app/build/outputs/apk/release/app-release.apk
            python3 native/verify_release_signing.py apk app/build/outputs/apk/release/app-release.apk \
              "$KEYFILE" "$ANDROID_HOME/build-tools/35.0.0/apksigner"
            echo 'signed=true' >> "$GITHUB_OUTPUT"
          else
            # Explicitly diagnostic, NOT a deliverable. Inference weights
            # provision on first run only after an authorized signed install.
            gradle --no-daemon :app:assembleRelease --stacktrace
            test -s app/build/outputs/apk/release/app-release-unsigned.apk
            python3 native/verify_apk_native.py --apk app/build/outputs/apk/release/app-release-unsigned.apk
            echo "::warning::No original owner signing key in protected GitHub secrets; release APK remains UNSIGNED."
            echo 'signed=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        if: success() && steps.release.outputs.signed == 'true'
        with:
          name: Asterion-Art-ORIGINAL-KEY-SIGNED-RELEASE-CANDIDATE
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: success() && steps.release.outputs.signed == 'false'
        with:
          name: Asterion-Art-UNSIGNED-DIAGNOSTIC-NOT-INSTALLABLE
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Asterion-Art-DEBUG-DIAGNOSTICS-NOT-FOR-INSTALL
          path: |
            app/build/test-results/testDebugUnitTest/**/*.xml
            app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn
