name: Fusion B tensor header compatibility (no weights)
on:
  workflow_dispatch:
  push:
    paths:
      - 'fusion/check_remote_tensors.py'
      - '.github/workflows/fusion-b-tensors.yml'
      - 'fusion/fusion_b_sources.json'
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate remote original Anima safetensors tensor names/shapes
        run: python3 fusion/check_remote_tensors.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Fusion-B-Tensor-Compatibility
          path: fusion_b_tensor_preflight.json
          if-no-files-found: warn
