# Source-only workflow. Intentionally NEVER builds or publishes an APK.
# The user prohibits app builds until the remaining development is complete.
name: Verify integrated offline model sources (manual, no APK build)
on:
  workflow_dispatch:
    inputs:
      explicitly_authorized:
        description: "Authorize verifying the pinned multi-GB model asset sources ONLY; no build"
        type: boolean
        required: true
        default: false
jobs:
  verify-model-asset-sources:
    if: ${{ inputs.explicitly_authorized == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify packaging logic with synthetic local files
        run: python3 -m unittest discover -s modelpack -p 'test_*.py' -v
      - name: Stage actual pinned reasoning and visual weights
        run: |
          python3 modelpack/prepare_embedded_models.py --output app/build/generated/embeddedModelsAssets
          python3 modelpack/prepare_embedded_models.py --output app/build/generated/embeddedModelsAssets --verify-only
      - name: Stage actual pinned Rin Anima QNN image-generation weights
        run: |
          python3 modelpack/prepare_embedded_image.py --output app/build/generated/embeddedModelsAssets
          python3 modelpack/prepare_embedded_image.py --output app/build/generated/embeddedModelsAssets --verify-only
      # This job never runs Gradle, Android SDK, APK/AAB packaging or a model
      # download on the user's phone. The staged weights are not published.
