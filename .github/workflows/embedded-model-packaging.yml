# Manual-only source/packaging verification. NOT triggered by push or PR.
# No release is made and no APK is uploaded until signing/distribution
# and the approved 1–3 capabilities have passed actual device tests.
name: Offline neural model packaging rehearsal (manual only)
on:
  workflow_dispatch:
    inputs:
      explicitly_authorized:
        description: "I explicitly authorize this one heavyweight packaging rehearsal"
        type: boolean
        required: true
        default: false
jobs:
  verify-offline-embedded-models:
    if: ${{ inputs.explicitly_authorized == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify deterministic source-only packaging tests
        run: python -m unittest discover -s modelpack -p 'test_*.py' -v
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Set up Android native compiler
        run: |
          yes | sdkmanager "ndk;27.2.12479018" "cmake;3.31.6" >/dev/null
      - name: Fetch pinned llama.cpp v0.7.0
        run: |
          git clone --quiet --depth 1 --branch v0.7.0 https://github.com/ggml-org/llama.cpp.git native/llama.cpp
          test "$(git -C native/llama.cpp rev-parse HEAD)" = "620d2225cc436ab0b001e3200e590e3b286ef9ab"
      - name: Stage pinned native runtimes
        run: |
          python3 native/prepare_native_runtime.py --project .
          python3 native/prepare_realsr.py --project .
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Test Android logic without heavyweight model assets
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace
      - name: Stage and hash all three bundled neural weights
        run: |
          python3 modelpack/prepare_embedded_models.py --output app/build/generated/embeddedModelsAssets
          python3 modelpack/prepare_embedded_models.py --output app/build/generated/embeddedModelsAssets --verify-only
      - name: Build unsigned, model-embedded APK strictly for verification
        run: gradle --no-daemon :app:assembleRelease --stacktrace
      - name: Verify actual APK neural/model payload and native runtime
        run: |
          python3 modelpack/verify_apk_embedded.py --apk app/build/outputs/apk/release/app-release-unsigned.apk
          python3 native/verify_apk_native.py --apk app/build/outputs/apk/release/app-release-unsigned.apk
      # Do not upload >2GiB APKs to restricted artifacts/releases; this job
      # intentionally has no download or publishing step. A production
      # distribution strategy and persistent signing key are still required.
