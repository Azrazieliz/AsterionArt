name: Asterion Compiler Android CI

on:
  push:
    branches: [main, asterion-rebuild-model-aware-prompts-lora-20261023]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Run JVM unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Build Android APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Upload test outputs and debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asterion-compiler-android-rebuild
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/test-results/testDebugUnitTest/**/*.xml
            app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 14
